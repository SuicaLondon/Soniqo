name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT: Soniqo.xcodeproj
  SCHEME: Soniqo
  CONFIGURATION: Release
  DERIVED_DATA: build/DerivedData
  APP_PATH: build/DerivedData/Build/Products/Release/Soniqo.app
  ENTITLEMENTS_PATH: Soniqo/Soniqo.entitlements

jobs:
  build:
    name: Build macOS app
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="0.0.0-dev"
          fi

          {
            echo "APP_VERSION=$APP_VERSION"
            echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER"
            echo "ZIP_PATH=dist/Soniqo-$APP_VERSION-macOS-universal.zip"
            echo "DMG_PATH=dist/Soniqo-$APP_VERSION.dmg"
          } >> "$GITHUB_ENV"

      - name: Check release credentials
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in \
            MACOS_CERTIFICATE \
            MACOS_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/soniqo-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/soniqo-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
              | head -n 1
          )"

          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::The imported .p12 does not contain a valid Developer ID Application identity and private key."
            exit 1
          fi

          if [[ "$SIGNING_IDENTITY" != *"($APPLE_TEAM_ID)" ]]; then
            echo "::error::The Developer ID certificate does not belong to APPLE_TEAM_ID."
            exit 1
          fi

          {
            echo "CERTIFICATE_PATH=$CERTIFICATE_PATH"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Build universal app
        shell: bash
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Sign app for development artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          codesign \
            --force \
            --options runtime \
            --entitlements "$ENTITLEMENTS_PATH" \
            --sign - \
            "$APP_PATH"

      - name: Sign app with Developer ID
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --entitlements "$ENTITLEMENTS_PATH" \
            --sign "$SIGNING_IDENTITY" \
            "$APP_PATH"

      - name: Verify app bundle
        shell: bash
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Contents/Info.plist"

          BINARY_ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/Soniqo")"
          echo "Architectures: $BINARY_ARCHS"
          [[ "$BINARY_ARCHS" == *arm64* ]]
          [[ "$BINARY_ARCHS" == *x86_64* ]]

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --entitlements - "$APP_PATH"

      - name: Create packages
        shell: bash
        run: |
          rm -rf build/dmg-root
          mkdir -p dist build/dmg-root
          cp -R "$APP_PATH" build/dmg-root/
          ln -s /Applications build/dmg-root/Applications

          hdiutil create \
            -volname "Soniqo" \
            -srcfolder build/dmg-root \
            -ov \
            -format UDZO \
            "$DMG_PATH"

      - name: Sign, notarize, and staple release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign \
            --force \
            --timestamp \
            --sign "$SIGNING_IDENTITY" \
            "$DMG_PATH"

          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$DMG_PATH"
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"
          xcrun stapler validate "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=2 \
            "$DMG_PATH"

      - name: Create ZIP and checksums
        shell: bash
        run: |
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          shasum -a 256 "$DMG_PATH" "$ZIP_PATH" > dist/SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Soniqo-${{ env.APP_VERSION }}-macOS
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.DMG_PATH }}
            dist/SHA256SUMS

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.DMG_PATH }}
            dist/SHA256SUMS
          generate_release_notes: true

      - name: Remove temporary signing keychain
        if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          KEYCHAIN_PATH="${KEYCHAIN_PATH:-$RUNNER_TEMP/soniqo-signing.keychain-db}"
          CERTIFICATE_PATH="${CERTIFICATE_PATH:-$RUNNER_TEMP/soniqo-developer-id.p12}"

          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [[ -f "$CERTIFICATE_PATH" ]]; then
            rm -f "$CERTIFICATE_PATH"
          fi
